name: publish release version

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to release (for example, v1.2.3)"
        required: true
        type: string
      ref:
        description: "Branch, tag, or commit to build from (default: main)"
        required: false
        default: main
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  RELEASE_TARGET: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.sha }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TARGET }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm build+zip
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build
  deploy-web:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TARGET }}
      - uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
  create-release:
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      upload_url: ${{ steps.release-info.outputs.upload_url || steps.create-release-info.outputs.upload_url }}
    steps:
      - uses: actions/github-script@v7
        id: release-info
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag,
              });
              core.setOutput("exists", "true");
              core.setOutput("upload_url", release.data.upload_url);
            } catch (error) {
              if (error.status === 404) {
                core.setOutput("exists", "false");
                core.setOutput("upload_url", "");
                core.notice(`Release not found for tag "${tag}"; a new one will be created.`);
              } else {
                throw error;
              }
            }
      - uses: actions/create-release@v1
        id: create-release
        if: steps.release-info.outputs.exists != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          release_name: ${{ format('Release {0}', env.RELEASE_TAG) }}
          target_commitish: ${{ env.RELEASE_TARGET }}
          draft: false
          prerelease: false
      - name: Capture created release upload URL
        if: steps.create-release.outputs.upload_url != ''
        id: create-release-info
        run: echo "upload_url=${{ steps.create-release.outputs.upload_url }}" >> $GITHUB_OUTPUT
  upload-release:
    needs: [build, create-release]
    strategy:
      matrix:
        client: ["chrome", "edge", "firefox", "userscript", "thunderbird"]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TARGET }}
      - uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build
      - uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./build/${{ matrix.client }}.zip
          asset_name: kiss-translator_${{ env.RELEASE_TAG }}_${{ matrix.client }}.zip
          asset_content_type: application/zip
